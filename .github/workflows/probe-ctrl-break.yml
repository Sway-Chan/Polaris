# G3 探针：Windows 服务能否给无 console 的子进程投递 CTRL_BREAK
#
# 真机协议 §组 G 的 G3。**这不是回归门，是一次性实验** —— 它的产物是「三档结论里的哪一档」，
# 不是绿或红。故：
#   · 只 workflow_dispatch，不挂 push/PR（额度：windows runner 2x 计费，这条腿约 3~5 分钟）；
#   · 服务模式的观测结果**不做断言**，写进 job summary 供人读；
#   · 但下面两件事必须让 job 红，否则这条自动化会变成一个「跑了等于没跑」的绿：
#       ① 正向对照失败 —— 探针自己写错了，服务侧的任何「失败」都只是在测 bug；
#       ② 服务跑完没产出结果文件 —— 「没执行」必须自曝，不能表现为「什么都没发生」。
#
# 为什么这条能上 CI 而 G 组其余两条不能：本探针**不建网卡、不改 IP/路由/DNS、不起 TUN**，
# 只在临时目录里起一个自带的子进程、投一次 console 控制事件。G1/G2 要真跑核 + 过 TUN 发查询，
# 属真机协议第 1 条「凡改动网络配置一律由陈先生本人执行」。
name: G3 probe (Windows CTRL_BREAK)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-ctrl-break-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: CTRL_BREAK 通道探测
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      # helper 只依赖纯 Rust 的 windows-sys，helper-proto 无 build.rs ⇒ 不需要 protoc / NASM。
      - name: Build probe
        run: cargo build -p polaris-helper --bin ctrl-break-probe --features ctrl-break-probe --release

      - name: 正向对照（带 console 的普通进程）
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'g3-control'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Join-Path $env:GITHUB_WORKSPACE 'target\release\ctrl-break-probe.exe'
          & $exe parent $dir
          $rc = $LASTEXITCODE
          Write-Host "probe exit code = $rc"
          # 探针会**故意破坏自己的 stdout**（AllocConsole 把标准句柄改指到新 console），
          # 所以观测通道是 trace 文件，不是控制台输出。无论成败都先把它倒出来 ——
          # 首跑那次只知道「没写结果」，说不出停在哪一步，白烧一轮。
          Get-ChildItem $dir | Format-Table Name,Length | Out-String | Write-Host
          Get-ChildItem $dir -Filter 'trace-*.log' | ForEach-Object {
            Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName | Write-Host
          }
          $p = Join-Path $dir 'result-parent.json'
          if (-not (Test-Path $p)) { throw "正向对照没产出结果文件（exit=$rc）—— 停在哪一步看上面的 trace" }
          $json = Get-Content $p -Raw
          Write-Host $json
          "CONTROL_JSON=$($json -replace "`r?`n",'')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $r = $json | ConvertFrom-Json
          # 对照取 **CREATE_NEW_PROCESS_GROUP 单独那一档**（= 上游的 flag 组合）：
          # 它必然继承父进程的 console，② 成功是既定事实。若连它都失败，说明探针写错了。
          # 不拿带 CREATE_NO_WINDOW 那一档当对照 —— 那一档「② 失败」恰恰是本实验要测的东西，
          # 拿被测量当对照，等于先假设了结论。
          $plain = $r.runs | Where-Object { $_.flags -eq 'CREATE_NEW_PROCESS_GROUP' }
          if (-not $plain) { throw "结果里没有 CREATE_NEW_PROCESS_GROUP 那一档 —— 探针的输出形状变了" }
          if (-not $plain.step2.graceful) {
            throw "🔴 正向对照失败：带 console 的普通进程里，② 直接投递 CTRL_BREAK 也没让子进程走优雅分支。探针自身有问题，服务侧结果无信息量。last_error=$($plain.step2.last_error)"
          }
          Write-Host '✅ 正向对照通过：观测通道是活的'

      - name: 服务模式（session 0，无 console）
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'g3-service'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Join-Path $env:GITHUB_WORKSPACE 'target\release\ctrl-break-probe.exe'
          # 服务名必须与 probes/ctrl_break_probe.rs 的 SERVICE_NAME 一致，否则 SCM 分派器起不来。
          $svc = 'PolarisCtrlBreakProbe'
          # `sc` 在 PowerShell 里是 Set-Content 的别名，必须写 sc.exe。
          # binPath 的空格：整串加引号，内层 exe 路径再加一层转义引号。
          sc.exe create $svc binPath= "`"$exe`" service `"$dir`"" start= demand | Write-Host
          sc.exe start $svc | Write-Host
          $deadline = (Get-Date).AddSeconds(120)
          $p = Join-Path $dir 'result-service.json'
          while ((Get-Date) -lt $deadline -and -not (Test-Path $p)) { Start-Sleep -Milliseconds 500 }
          sc.exe query $svc | Write-Host
          sc.exe stop $svc   2>&1 | Out-Null
          sc.exe delete $svc 2>&1 | Out-Null
          $err = Join-Path $dir 'service-dispatcher-error.txt'
          if (Test-Path $err) { Write-Host (Get-Content $err -Raw) }
          Get-ChildItem $dir | Format-Table Name,Length | Out-String | Write-Host
          Get-ChildItem $dir -Filter 'trace-*.log' | ForEach-Object {
            Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName | Write-Host
          }
          # no-alloc 那一格才是真实 helper 今天的处境（服务从不 AllocConsole）。
          $pn = Join-Path $dir 'result-service-noalloc.json'
          if (Test-Path $pn) {
            $jn = Get-Content $pn -Raw
            Write-Host "NOALLOC: $jn"
            "SERVICE_NOALLOC_JSON=$($jn -replace "`r?`n",'')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            throw "🔴 no-alloc 那一格没产出结果 —— 少了它就答不出「改 helper 时要不要先 AllocConsole」"
          }
          if (-not (Test-Path $p)) {
            throw "🔴 服务跑完没有结果文件。这不是『实验得出否定结论』，是**实验没跑成** —— 先看上面的 sc query 与 dispatcher error 再重来。"
          }
          $json = Get-Content $p -Raw
          Write-Host $json
          "SERVICE_JSON=$($json -replace "`r?`n",'')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 结论
        shell: pwsh
        run: |
          $svc = $env:SERVICE_JSON | ConvertFrom-Json
          $lines = @('# G3 结论：Windows 服务的 CTRL_BREAK 通道', '')
          $lines += "服务侧进程有无 console：``had_console=$($svc.had_console)``（自建 console：``$($svc.allocated_console)``）"
          $lines += ''
          $lines += '| flag 组合 | ② 直接投递 | ③ AttachConsole 后 | 判读 |'
          $lines += '|---|---|---|---|'
          foreach ($r in $svc.runs) {
            $verdict =
              if ($r.step2.graceful) { '**档 1**：`send_ctrl_break` 那句「服务模式 no-op」注释本身是错的 ⇒ 直接改 helper' }
              elseif ($r.step3.graceful) { '**档 2**：方案成立 ⇒ `reap_sequence` 补一次 AttachConsole，失败回落 `TerminateProcess`' }
              else { '**档 3**：console 通道整条死 ⇒ 只能换机制（去掉 `CREATE_NO_WINDOW` 让 helper 自建隐藏 console，须与黑窗抑制门重新对齐）' }
            $s2 = if ($r.step2.graceful) { '✅ 优雅退出' } else { "❌（api_ok=$($r.step2.api_ok) err=$($r.step2.last_error)）" }
            $s3 = if (-not $r.step3.ran) { '—（②已成功）' } elseif ($r.step3.graceful) { '✅ 优雅退出' } else { "❌（attach_ok=$($r.step3.attach_ok) attach_err=$($r.step3.attach_error) api_ok=$($r.step3.api_ok) err=$($r.step3.last_error)）" }
            $lines += "| ``$($r.flags)`` | $s2 | $s3 | $verdict |"
          }
          $lines += ''
          # 决定实现形态的那一格：服务**没有**自建 console 时，③ 还成不成立。
          $na = $env:SERVICE_NOALLOC_JSON | ConvertFrom-Json
          $naRun = $na.runs | Where-Object { $_.flags -like '*CREATE_NO_WINDOW*' }
          $lines += '## 改 helper 时要不要先 `AllocConsole`'
          $lines += "服务未自建 console（`had_console=$($na.had_console)` / `allocated=$($na.allocated_console)`）时，Polaris 现有 flag 组合的结果："
          $lines += "② `graceful=$($naRun.step2.graceful)`（api_ok=$($naRun.step2.api_ok) err=$($naRun.step2.last_error)）／③ `attach_ok=$($naRun.step3.attach_ok)` `graceful=$($naRun.step3.graceful)`（err=$($naRun.step3.last_error)）"
          $lines += if ($naRun.step3.graceful) {
            '⇒ **不需要**先 AllocConsole：`FreeConsole` + `AttachConsole(child)` 在裸服务里直接成立，`reap_sequence` 补这一段即可。'
          } elseif ($naRun.step2.graceful) {
            '⇒ 直接投递就成立，连 AttachConsole 都不需要。'
          } else {
            '⇒ **需要**先给服务自建一个 console（或换机制）：裸服务下这条通道不通，上面那张表的「档 2」是在已有 console 的前提下取得的，不能直接照搬。'
          }
          $lines += ''
          # 顺带回答那处未记录的行为分叉：Polaris 比 上游 多传了 CREATE_NO_WINDOW。
          $withNo = $svc.runs | Where-Object { $_.flags -like '*CREATE_NO_WINDOW*' }
          $without = $svc.runs | Where-Object { $_.flags -eq 'CREATE_NEW_PROCESS_GROUP' }
          $okWith = $withNo.step2.graceful -or $withNo.step3.graceful
          $okWithout = $without.step2.graceful -or $without.step3.graceful
          $lines += '## 顺带：`CREATE_NO_WINDOW` 这处 Polaris/上游 分叉'
          $lines += if ($okWith -eq $okWithout) {
            "两种 flag 组合结论相同（可优雅退出：``$okWith``）⇒ 多传的 ``CREATE_NO_WINDOW`` **不影响**这条通道，黑窗抑制可以原样保留。"
          } elseif ($okWithout -and -not $okWith) {
            "**只有不带 ``CREATE_NO_WINDOW`` 时通道才活** ⇒ Polaris 多传的这个 flag 正是把优雅通道掐死的那一处。换机制方案（自建隐藏 console）由此得到直接支持。"
          } else {
            "带 ``CREATE_NO_WINDOW`` 反而可用 —— 与预期相反，先复核探针再下结论。"
          }
          $lines += ''
          $lines += '<details><summary>原始结果 JSON</summary>'
          $lines += ''
          $lines += '```json'
          $lines += "对照（有 console）: $env:CONTROL_JSON"
          $lines += "服务（session 0）: $env:SERVICE_JSON"
          $lines += '```'
          $lines += '</details>'
          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host ($lines -join "`n")
